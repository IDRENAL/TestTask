services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: script_manager
      POSTGRES_USER: script_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U script_manager -d script_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SCRIPT_MANAGER_API_KEY: ${SCRIPT_MANAGER_API_KEY:?Set SCRIPT_MANAGER_API_KEY}
      SCRIPT_MANAGER_DATABASE_URL: postgresql+psycopg://script_manager:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/script_manager
      SCRIPT_MANAGER_SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
      SCRIPT_MANAGER_SCRIPTS_DIR: /app/scripts
    volumes:
      - ./scripts:/app/scripts:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  database-data:
